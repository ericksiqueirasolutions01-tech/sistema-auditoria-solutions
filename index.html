<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-solutions.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C4DA2" />
    <meta name="description" content="Sistema de Auditoria e Qualidade Operacional Samsung - Grupo Solutions" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SISTEMA DE AUDITORIA GRUPO SOLUTIONS - SAMSUNG</title>
  </head>
  <body class="bg-slate-100 text-slate-900 antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registrado com sucesso para suporte Offline:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
